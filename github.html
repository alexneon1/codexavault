<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><meta name="description" content="CodeXavault — secure code sharing for teams and individuals"><title>GitHub integration — CodeXavault</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body class="app-body"><div class="app-page" data-page="github" data-title="GitHub integration" data-description="Import a repository into your CodeXavault workspace."><div class="page-content"><div class="github-layout"><section class="panel github-connect"><div class="github-logo">◉</div><div class="eyebrow">REPOSITORY IMPORT</div><h2>Bring your code<br>into your vault.</h2><p>Connect GitHub to browse repositories and select the project you want to import.</p><button class="btn btn-primary" data-github-connect>Connect GitHub <span>↗</span></button><small class="muted">Demo only · OAuth is not connected</small></section><section class="panel repo-panel"><div class="panel-heading"><div><h2>Your repositories</h2><p>Sample repositories for the import preview.</p></div><span class="status-chip">Demo data</span></div><input class="search-input full-search" data-repo-search placeholder="⌕ Search repositories…"><div id="repoList"><label class="repo-item"><input type="radio" name="repo" value="codexavault-starter" checked><span class="repo-icon">▤</span><span><b>codexavault-starter</b><small>Starter workspace · JavaScript · Updated 2 days ago</small></span><em>Public</em></label><label class="repo-item"><input type="radio" name="repo" value="secure-api"><span class="repo-icon">▤</span><span><b>secure-api</b><small>API and auth utilities · Python · Updated 1 week ago</small></span><em>Private</em></label><label class="repo-item"><input type="radio" name="repo" value="portfolio-ui"><span class="repo-icon">▤</span><span><b>portfolio-ui</b><small>Personal portfolio · HTML · Updated 3 weeks ago</small></span><em>Public</em></label></div><div class="import-options"><label>Import branch<select><option>main</option><option>develop</option></select></label><label>Workspace name<input id="importName" value="codexavault-starter"></label></div><button class="btn btn-primary btn-full" data-import-repo>Import selected repository <span>→</span></button><p id="importMessage" class="form-message"></p></section></div></div></div></body></html>
