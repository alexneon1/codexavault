<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><meta name="description" content="CodeXavault — secure code sharing for teams and individuals"><title>Create account — CodeXavault</title><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body class="auth-body"><main class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">⬡</span>Code<span>Xavault</span></a><section class="auth-card"><div class="auth-symbol">⬡</div><div class="eyebrow">GET STARTED</div><h1>Create your vault.</h1><p class="muted">A focused space for your code and collaboration.</p><form id="signupForm"><label>Full name<input name="name" type="text" placeholder="Your name" required autocomplete="name"></label><label>Email address<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<div class="password-wrap"><input id="signupPassword" name="password" type="password" placeholder="Create a password" required minlength="4" autocomplete="new-password"><button type="button" class="password-toggle" data-toggle-password>Show</button></div></label><div class="strength-row"><span>Password strength</span><div class="strength-track"><i id="strengthBar"></i></div><b id="strengthLabel">—</b></div><button class="btn btn-primary btn-full" type="submit">Create account <span>→</span></button><p class="form-message" id="formMessage" aria-live="polite"></p></form><div class="auth-bottom">Already have an account? <a href="login.html">Log in</a></div><div class="demo-note">Demo mode · Account details stay in this browser only.</div></section><a class="back-home" href="index.html">← Back to home</a></main></body></html>
